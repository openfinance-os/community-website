name: 'Setup Node.js'
description: 'Setup Node.js with npm caching and install dependencies'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22.23.1'
  install-deps:
    description: 'Whether to install npm dependencies'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    # Cache node_modules itself (keyed on the lockfile + node version) so
    # `npm ci` is skipped entirely on a hit — the runners here are always
    # ubuntu + a fixed node version, so the binaries are portable.
    - name: Cache node_modules
      id: node-modules-cache
      if: inputs.install-deps == 'true'
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: inputs.install-deps == 'true' && steps.node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
