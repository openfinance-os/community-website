name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

env:
  NODE_VERSION: '20'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Lint & Format Check (runs in parallel)
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check formatting
        run: npx prettier --check .

  # ============================================
  # Type Check (runs in parallel)
  # ============================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Type check
        run: npm run check

  # ============================================
  # Security Audit (runs in parallel)
  # ============================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run security audit
        run: |
          echo "### Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run audit and capture output
          npm audit --json > audit.json 2>&1 || true

          # Parse results
          critical=$(jq '.metadata.vulnerabilities.critical // 0' audit.json)
          high=$(jq '.metadata.vulnerabilities.high // 0' audit.json)
          moderate=$(jq '.metadata.vulnerabilities.moderate // 0' audit.json)
          low=$(jq '.metadata.vulnerabilities.low // 0' audit.json)

          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $critical |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $high |" >> $GITHUB_STEP_SUMMARY
          echo "| Moderate | $moderate |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $low |" >> $GITHUB_STEP_SUMMARY

          # Fail on critical or high vulnerabilities
          if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
            echo ""
            echo "::error::Found $critical critical and $high high severity vulnerabilities"
            npm audit --audit-level=high
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No critical or high severity vulnerabilities found" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Build (runs in parallel with lint/typecheck)
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build site
        run: npm run build

      - name: Report build size
        run: |
          echo "### Build Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Directory | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total | $(du -sh dist | cut -f1) |" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ============================================
  # Lighthouse CI (performance quality gate)
  # Non-blocking due to pre-existing performance issues
  # Results are reported but don't fail the build
  # ============================================
  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ============================================
  # Link Check (quick check on changed files)
  # ============================================
  link-check:
    name: Link Check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on PRs to avoid slowing down main branch pushes
    if: github.event_name == 'pull_request'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,204,301,302,403
            --exclude '^mailto:'
            --timeout 15
            --max-concurrency 5
            './dist/**/*.html'
          fail: true

  # ============================================
  # CI Status (aggregates all job results)
  # ============================================
  ci-status:
    name: CI Status
    needs: [lint, typecheck, security-audit, build, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check job results
        run: |
          echo "### CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse | ${{ needs.lighthouse.result }} |" >> $GITHUB_STEP_SUMMARY

          # Fail if any required job failed (lighthouse is non-blocking)
          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.typecheck.result }}" = "failure" ] || \
             [ "${{ needs.security-audit.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ]; then
            echo ""
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          # Warn if lighthouse failed (non-blocking)
          if [ "${{ needs.lighthouse.result }}" = "failure" ]; then
            echo ""
            echo "::warning::Lighthouse performance checks failed - review reports"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All CI checks passed" >> $GITHUB_STEP_SUMMARY
