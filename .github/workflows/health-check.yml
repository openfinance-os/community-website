name: Site Health Check

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode - simulate failure to verify notifications'
        required: false
        default: 'false'
        type: boolean

# Prevent multiple health checks running simultaneously
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Test mode check
        if: ${{ inputs.test_mode == true }}
        run: |
          echo "::notice::Running in TEST MODE - will simulate failure to verify notifications"
          echo "### ⚠️ TEST MODE ENABLED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This run will simulate a failure to test Slack notifications." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check site availability
        id: site-check
        run: |
          echo "### Site Health Check Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Page | Status | Response Time |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|---------------|" >> $GITHUB_STEP_SUMMARY

          check_url() {
            local url=$1
            local name=$2
            local start=$(date +%s%N)
            local response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url")
            local end=$(date +%s%N)
            local duration=$(( (end - start) / 1000000 ))

            if [ "$response" = "200" ]; then
              echo "| $name | $response | ${duration}ms |" >> $GITHUB_STEP_SUMMARY
              echo "$name: HTTP $response (${duration}ms)"
            else
              echo "| $name | $response | ${duration}ms |" >> $GITHUB_STEP_SUMMARY
              echo "$name: HTTP $response (${duration}ms)"
              return 1
            fi
          }

          failed=0

          check_url "https://openfinance-os.org" "Homepage" || failed=1
          check_url "https://openfinance-os.org/observatory/" "Observatory" || failed=1
          check_url "https://openfinance-os.org/news/" "News" || failed=1
          check_url "https://openfinance-os.org/learn/" "Learn" || failed=1
          check_url "https://openfinance-os.org/community/" "Community" || failed=1
          check_url "https://openfinance-os.org/about/" "About" || failed=1

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Checked at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

          if [ $failed -eq 1 ]; then
            echo "::error::One or more pages failed health check"
            exit 1
          fi

      - name: Check SSL certificate
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SSL Certificate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          expiry=$(echo | openssl s_client -servername openfinance-os.org -connect openfinance-os.org:443 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          expiry_epoch=$(date -d "$expiry" +%s)
          now_epoch=$(date +%s)
          days_left=$(( (expiry_epoch - now_epoch) / 86400 ))

          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Expiry Date | $expiry |" >> $GITHUB_STEP_SUMMARY
          echo "| Days Remaining | $days_left |" >> $GITHUB_STEP_SUMMARY

          if [ $days_left -lt 14 ]; then
            echo "::warning::SSL certificate expires in $days_left days"
          fi

      - name: Check response headers
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Headers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          headers=$(curl -s -I "https://openfinance-os.org" 2>/dev/null)

          check_header() {
            local header=$1
            if echo "$headers" | grep -qi "^$header:"; then
              echo "| $header | Present |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $header | Missing |" >> $GITHUB_STEP_SUMMARY
            fi
          }

          echo "| Header | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY

          check_header "X-Frame-Options"
          check_header "X-Content-Type-Options"
          check_header "Content-Security-Policy"
          check_header "Referrer-Policy"

      - name: Simulate failure (test mode only)
        if: ${{ inputs.test_mode == true }}
        run: |
          echo "::error::TEST MODE - Simulating health check failure to verify notifications"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Test Failure Simulation" >> $GITHUB_STEP_SUMMARY
          echo "This failure was intentionally triggered to test the notification system." >> $GITHUB_STEP_SUMMARY
          exit 1

  notify-on-failure:
    name: Notify on Failure
    needs: health-check
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Create issue for failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Site Health Check Failed - ${new Date().toISOString().split('T')[0]}`;

            // Check for existing open issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-check'
            });

            const existingIssue = issues.find(issue =>
              issue.title.includes('Site Health Check Failed')
            );

            if (existingIssue) {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Health check failed again at ${new Date().toISOString()}\n\nSee [workflow run](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: `## Site Health Check Failed

            The automated health check has detected issues with the production site.

            **Workflow Run:** [View Details](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            Please investigate and resolve as soon as possible.`,
                labels: ['health-check', 'bug', 'priority:high']
              });
            }

      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_ALERT_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_ALERT_URL }}
        run: |
          TEST_MODE="${{ inputs.test_mode }}"
          if [ "$TEST_MODE" = "true" ]; then
            TITLE="🧪 [TEST] Health Check Notification Test"
            MESSAGE="This is a test notification to verify the health check alerting system is working correctly."
            COLOR="#36a64f"
          else
            TITLE="🚨 Site Health Check Failed"
            MESSAGE="The automated health check has detected issues with the production site. Please investigate immediately."
            COLOR="#dc3545"
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"blocks\": [
                  {
                    \"type\": \"header\",
                    \"text\": {
                      \"type\": \"plain_text\",
                      \"text\": \"$TITLE\",
                      \"emoji\": true
                    }
                  },
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"$MESSAGE\"
                    }
                  },
                  {
                    \"type\": \"section\",
                    \"fields\": [
                      {
                        \"type\": \"mrkdwn\",
                        \"text\": \"*Repository:*\n${{ github.repository }}\"
                      },
                      {
                        \"type\": \"mrkdwn\",
                        \"text\": \"*Triggered by:*\n${{ github.actor }}\"
                      }
                    ]
                  },
                  {
                    \"type\": \"actions\",
                    \"elements\": [
                      {
                        \"type\": \"button\",
                        \"text\": {
                          \"type\": \"plain_text\",
                          \"text\": \"View Workflow Run\",
                          \"emoji\": true
                        },
                        \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                      },
                      {
                        \"type\": \"button\",
                        \"text\": {
                          \"type\": \"plain_text\",
                          \"text\": \"View Site\",
                          \"emoji\": true
                        },
                        \"url\": \"https://openfinance-os.org\"
                      }
                    ]
                  }
                ]
              }]
            }" \
            "$SLACK_WEBHOOK_URL"

          echo "Slack notification sent successfully"
