name: Observatory Data Update

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  pull_request:
    paths:
      - 'scripts/collect-observatory.ts'
      - 'scripts/utils/directory-client.ts'
      - 'scripts/types/participant.ts'
      - '.github/workflows/observatory-update.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commit)'
        required: false
        default: 'false'
        type: boolean

# Prevent multiple data updates running simultaneously
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validation job for pull requests - checks script compiles without fetching external data
  validate:
    name: Validate Collector Script
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Validate TypeScript compilation
        run: npx tsx --eval "import('./scripts/collect-observatory.ts')" 2>&1 || true

      - name: Run collector in dry-run mode
        run: npm run collect:dry
        continue-on-error: true

      - name: Log result
        run: |
          echo "### Observatory Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validated collector script compiles correctly." >> $GITHUB_STEP_SUMMARY
          echo "Note: External API calls may fail in CI - this is expected for PR validation." >> $GITHUB_STEP_SUMMARY

  # Data collection job for scheduled runs and manual triggers
  collect:
    name: Collect Observatory Data
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Run collector script
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run collect:dry
          else
            npm run collect
          fi

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet data/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true' && inputs.dry_run != 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/observatory/
          git commit -m "chore(observatory): update snapshot $(date -u +%Y-%m-%d)"
          git push

      - name: Log result
        run: |
          echo "### Observatory Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.git-check.outputs.changes }}" = "true" ]; then
            echo "Observatory data updated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "No changes detected in observatory data" >> $GITHUB_STEP_SUMMARY
          fi
