name: Daily News Curation

on:
  schedule:
    # Run daily at 08:00 UTC (12:00 PM UAE time)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no PRs created)'
        required: false
        default: 'false'
        type: boolean

# Prevent multiple news curation runs simultaneously
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  curate:
    name: Curate News
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Run news curation
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run curate-news:dry
          else
            npm run curate-news
          fi

      - name: Log result
        if: always()
        run: |
          echo "### News Curation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "News curation workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "Check Slack for notification with PR links" >> $GITHUB_STEP_SUMMARY
