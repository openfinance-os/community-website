name: Check Links

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

# Prevent multiple link checks running simultaneously
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-link-check
          path: dist/
          retention-days: 1

  check-links:
    name: Check Links
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Checkout so lychee picks up .lycheeignore from the repo root.
      # Runs before the artifact download; checkout cleans the workspace first.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Participant homepages (third-party bank/insurer/fintech sites) are
      # bot-hostile and fail intermittently in CI though they load fine in a
      # browser. Append them to .lycheeignore from their single source of truth
      # so the list never needs manual upkeep as participants change.
      - name: Append participant homepages to lychee ignore
        run: |
          node -e '
            const d = require("./data/participants/profiles.json");
            const hosts = new Set();
            JSON.stringify(d).replace(/https?:\/\/[^"\\ ]+/g, (u) => {
              try { hosts.add(new URL(u).host); } catch {}
              return u;
            });
            const lines = [...hosts].sort().map((h) => "://" + h.replace(/\./g, "\\."));
            require("fs").appendFileSync(".lycheeignore", "\n# --- participant homepages (auto-generated) ---\n" + lines.join("\n") + "\n");
            console.log("Appended " + lines.length + " participant hosts to .lycheeignore");
          '

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-link-check
          path: dist/

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --accept 200,204,301,302,403,405,429
            --max-retries 2
            --timeout 30
            './dist/**/*.html'
          fail: true
          output: ./lychee-report.md

      - name: Upload link check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-check-report
          path: lychee-report.md
          retention-days: 7

  create-issue:
    name: Create Issue on Failure
    needs: check-links
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Download link check report
        uses: actions/download-artifact@v4
        with:
          name: link-check-report
        continue-on-error: true

      - name: Create issue for broken links
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reportContent = '';

            try {
              reportContent = fs.readFileSync('lychee-report.md', 'utf8');
            } catch (e) {
              reportContent = 'Unable to read link check report. See workflow run for details.';
            }

            // Check for existing open issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links'
            });

            const existingIssue = issues.find(issue =>
              issue.title.includes('Broken links detected')
            );

            const body = `## Broken Links Detected

            The weekly link check found broken links in the site.

            **Workflow Run:** [View Details](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            ### Report
            ${reportContent.substring(0, 60000)}`;

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Link check failed again at ${new Date().toISOString()}\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Broken links detected',
                body: body,
                labels: ['broken-links', 'bug']
              });
            }
