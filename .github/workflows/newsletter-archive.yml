name: Sync newsletter archive

on:
  schedule:
    # Daily at 09:00 UTC, after the morning news curation run.
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Refresh sent issues
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Fetch sent Buttondown issues
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: node scripts/sync-newsletter-archive.mjs

      - name: Check for archive changes
        id: changes
        run: |
          if git diff --quiet -- data/newsletter/issues.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Newsletter archive is already up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Every archived issue needs a 1200x630 share card (newsletter-images.test.ts).
      - name: Install Chromium for share cards
        if: steps.changes.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Render missing issue share cards
        if: steps.changes.outputs.changed == 'true'
        run: npx tsx scripts/generate-newsletter-images.ts --missing-issue-cards

      # A pull request opened with GITHUB_TOKEN does not trigger CI, so the
      # bot PRs used to sit unmerged. Run the same gates here instead, and
      # publish only if they pass.
      - name: Validate (type check, format, unit tests, build)
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run check
          npx prettier --check data/newsletter/issues.json
          npm test
          npm run build

      - name: Commit and push to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newsletter/issues.json public/newsletter/og/
          git commit -m "Update newsletter archive from Buttondown"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Published the updated newsletter archive to main." >> "$GITHUB_STEP_SUMMARY"
