name: News Curation Cleanup

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC to clean up stale PRs
    - cron: '0 0,12 * * *'
  workflow_dispatch:

# Prevent multiple cleanup runs simultaneously
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup Stale PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Cleanup stale news PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run curate-news:cleanup

      - name: Log result
        if: always()
        run: |
          echo "### Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Cleanup workflow completed" >> $GITHUB_STEP_SUMMARY
