<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>Saudi open banking and UAE Open Finance milestones, 2022 to 2026</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}.inks{stroke:var(--color-brand-ink,#0d4f4f)}.accs{stroke:var(--color-accent,#e8a85c)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><text class="t" x="32" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#132c2b">Same idea, different order</text><text class="t2" x="32" y="66" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Selected milestones, not a scoreboard · sources linked in the post</text><text class="ink" x="32" y="110" font-size="13" font-weight="700" text-anchor="start" fill="#0d4f4f">SAUDI ARABIA</text><line class="bd" x1="40" y1="140" x2="612" y2="140" stroke="#dce5df" stroke-width="2"/><circle class="ink" cx="60" cy="140" r="6" fill="#0d4f4f"/><text class="t" x="60" y="128" font-size="10" font-weight="600" text-anchor="middle" fill="#132c2b">Nov 2022</text><text class="t" x="60" y="162" font-size="10" font-weight="400" text-anchor="middle" fill="#132c2b">Framework R1</text><text class="t2" x="60" y="176" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">account info</text><circle class="ink" cx="160" cy="140" r="6" fill="#0d4f4f"/><text class="t" x="160" y="128" font-size="10" font-weight="600" text-anchor="middle" fill="#132c2b">Sep 2024</text><text class="t" x="160" y="162" font-size="10" font-weight="400" text-anchor="middle" fill="#132c2b">Framework R2</text><text class="t2" x="160" y="176" font-size="10" font-weight="400" text-anchor="middle" fill="