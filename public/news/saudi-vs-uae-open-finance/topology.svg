<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>Saudi and UAE open banking connection models compared</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}.inks{stroke:var(--color-brand-ink,#0d4f4f)}.accs{stroke:var(--color-accent,#e8a85c)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><text class="t" x="32" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#132c2b">Where the connection runs</text><text class="t2" x="32" y="66" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Saudi side: our reading of SAMA's framework and payments rules · UAE side: Open Finance UAE skill</text><rect class="soft" x="24" y="84" width="288" height="292" rx="12" fill="#e7efea"/><text class="ink" x="44" y="112" font-size="13" font-weight="700" text-anchor="start" fill="#0d4f4f">SAUDI ARABIA</text><text class="t2" x="44" y="130" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Licensed provider connects to each bank</text><rect class="acc" x="44" y="206" width="92" height="44" rx="8" fill="#e8a85c"/><text class="t" x="90" y="226" font-size="11" font-weight="700" text-anchor="middle" fill="#132c2b">Licensed</text><text class="t" x="90" y="240" font-size="11" font-weight="700" text-anchor="middle" fill="#132c2b">provider</text><line class="inks" x1="136" y1="228" x2="206" y2="172" stroke="#0d4f4f" stroke-width="1.6"/><rect class="ink" x="206" y="156" width="88" height="32" rx="6" fill="#0d4f4f"/><text class="card" x="250" y="176" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">Bank A</text><line class="inks" x1="136" y1="228" x2="206" y2="228" stroke="#0d4f4f" stroke-width="1.6"/><rect class="ink" x="206" y="212" width="88" height="32" rx="6" fill="#0d4f4f"/><text class="card" x="250" y="232" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">Bank B</text><line class="inks" x1="136" y1="228" x2="206" y2="284" stroke="#0d4f4f" stroke-width="1.6"/><rect class="ink" x="206" y="268" width="88" height="32" rx="6" fill="#0d4f4f"/><text class="card" x="250" y="288" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">Bank C</text><text class="t" x="44" y="326" font-size="11" font-weight="400" text-anchor="start" fill="#132c2b">Consent duties sit with provider and bank</text><text class="t" x="44" y="344" font-size="11" font-weight="400" text-anchor="start" fill="#132c2b">Common standard; certified in the SAMA Lab</text><text class="t2" x="44" y="362" font-size="10" font-weight="400" text-anchor="start" fill="#526662">Rulebook Arts 96–99</text><rect class="soft" x="328" y="84" width="288" height="292" rx="12" fill="#e7efea"/><text class="ink" x="348" y="112" font-size="13" font-weight="700" text-anchor="start" fill="#0d4f4f">UAE</text><text class="t2" x="348" y="130" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Every call goes TPP → API Hub → LFI</text><rect class="acc" x="348" y="206" width="56" height="44" rx="8" fill="#e8a85c"/><text class="t" x="376" y="232" font-size="12" font-weight="700" text-anchor="middle" fill="#132c2b">TPP</text><line class="inks" x1="404" y1="228" x2="428" y2="228" stroke="#0d4f4f" stroke-width="1.6"/><rect class="ink" x="428" y="190" width="76" height="76" rx="10" fill="#0d4f4f"/><text class="card" x="466" y="220" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">API Hub</text><text class="card" x="466" y="238" font-size="10" font-weight="400" text-anchor="middle" fill="#ffffff">consent</text><text class="card" x="466" y="252" font-size="10" font-weight="400" text-anchor="middle" fill="#ffffff">+ tokens</text><line class="inks" x1="504" y1="228" x2="532" y2="172" stroke="#0d4f4f" stroke-width="1.6"/><rect stroke="#dce5df" class="card bd" x="532" y="156" width="68" height="32" rx="6" fill="#ffffff"/><text class="t" x="566" y="176" font-size="11" font-weight="600" text-anchor="middle" fill="#132c2b">LFI</text><line class="inks" x1="504" y1="228" x2="532" y2="228" stroke="#0d4f4f" stroke-width="1.6"/><rect stroke="#dce5df" class="card bd" x="532" y="212" width="68" height="32" rx="6" fill="#ffffff"/><text class="t" x="566" y="232" font-size="11" font-weight="600" text-anchor="middle" fill="#132c2b">LFI</text><line class="inks" x1="504" y1="228" x2="532" y2="284" stroke="#0d4f4f" stroke-width="1.6"/><rect stroke="#dce5df" class="card bd" x="532" y="268" width="68" height="32" rx="6" fill="#ffffff"/><text class="t" x="566" y="288" font-size="11" font-weight="600" text-anchor="middle" fill="#132c2b">LFI</text><text class="t" x="348" y="326" font-size="11" font-weight="400" text-anchor="start" fill="#132c2b">Consents stored only in the Hub</text><text class="t" x="348" y="344" font-size="11" font-weight="400" text-anchor="start" fill="#132c2b">Only the Hub issues tokens; PSU logs in at LFI</text><text class="t2" x="348" y="362" font-size="10" font-weight="400" text-anchor="start" fill="#526662">TPPs never call LFIs directly</text></svg>