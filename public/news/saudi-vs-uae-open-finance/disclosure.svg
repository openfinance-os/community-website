<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>What Saudi Arabia and the UAE publish about open banking usage</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}.inks{stroke:var(--color-brand-ink,#0d4f4f)}.accs{stroke:var(--color-accent,#e8a85c)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><text class="t" x="32" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#132c2b">What each market publishes</text><text class="t2" x="32" y="66" font-size="11" font-weight="400" text-anchor="start" fill="#526662">As of 12 Nov 2026 · "Not found" = not found in public sources, not proof it does not exist</text><rect class="soft" x="24" y="84" width="592" height="28" rx="6" fill="#e7efea"/><text class="t2" x="40" y="103" font-size="11" font-weight="700" text-anchor="start" fill="#526662">Measure</text><text class="t2" x="232" y="103" font-size="11" font-weight="700" text-anchor="start" fill="#526662">Saudi Arabia</text><text class="t2" x="438" y="103" font-size="11" font-weight="700" text-anchor="start" fill="#526662">UAE</text><line class="bd" x1="24" y1="154" x2="616" y2="154" stroke="#dce5df" stroke-width="1"/><text class="t" x="40" y="138" font-size="12" font-weight="600" text-anchor="start" fill="#132c2b">Licences / registrations</text><circle cx="222" cy="134" r="4" fill="#0d4f4f" stroke="#0d4f4f" stroke-width="1.2"/><text class="t" x="232" y="138" font-size="11" font-weight="400" text-anchor="start" fill="#132c2b">Yes, SAMA releases</text><circle class="acc" cx="428" cy="134" r="4" fill="#e8a85c"/><text class="ink" x="438" y="138" font-size="11" font-weight="600" text-anchor="start" fill="#0d4f4f">Yes, public directory</text><line class="bd" x1="24" y1="196" x2="616" y2="196" stroke="#dce5df" stroke-width="1"/><text class="t" x="40" y="180" font-size="12" font-weight="600" text-anchor="start" fill="#132c2b">Headline usage unit</text><circle cx="222" cy="176" r="4" fill="#0d4f4f" stroke="#0d4f4f" stroke-width="1.2"/><text class="t" x="232" y="180" font-size="11" font-weight="400" text-anchor="start" fill="#132c2b">Connected accounts, yearly</text><circle class="acc" cx="428" cy="176" r="4" fill="#e8a85c"/><text class="ink" x="438" y="180" font-size="11" font-weight="600" text-anchor="start" fill="#0d4f4f">API calls + payments, weekly</text><line class="bd" x1="24" y1="238" x2="616" y2="238" stroke="#dce5df" stroke-width="1"/><text class="t" x="40" y="222" font-size="12" font-weight="600" text-anchor="start" fill="#132c2b">Monthly call volumes</text><circle cx="222" cy="218" r="4" fill="#ffffff" stroke="#526662" stroke-width="1.2"/><text class="t2" x="232" y="222" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Not found</text><circle class="acc" cx="428" cy="218" r="4" fill="#e8a85c"/><text class="ink" x="438" y="222" font-size="11" font-weight="600" text-anchor="start" fill="#0d4f4f">842,969 in Oct 2026</text><line class="bd" x1="24" y1="280" x2="616" y2="280" stroke="#dce5df" stroke-width="1"/><text class="t" x="40" y="264" font-size="12" font-weight="600" text-anchor="start" fill="#132c2b">Accepted payment value</text><circle cx="222" cy="260" r="4" fill="#ffffff" stroke="#526662" stroke-width="1.2"/><text class="t2" x="232" y="264" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Not found; no PIS licence seen</text><circle class="acc" cx="428" cy="260" r="4" fill="#e8a85c"/><text class="ink" x="438" y="264" font-size="11" font-weight="600" text-anchor="start" fill="#0d4f4f">AED 414.9m, 12 months</text><line class="bd" x1="24" y1="322" x2="616" y2="322" stroke="#dce5df" stroke-width="1"/><text class="t" x="40" y="306" font-size="12" font-weight="600" text-anchor="start" fill="#132c2b">Consents created</text><circle cx="222" cy="302" r="4" fill="#ffffff" stroke="#526662" stroke-width="1.2"/><text class="t2" x="232" y="306" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Not found</text><circle class="acc" cx="428" cy="302" r="4" fill="#e8a85c"/><text class="ink" x="438" y="306" font-size="11" font-weight="600" text-anchor="start" fill="#0d4f4f">117,803, 12 months</text><text class="t" x="40" y="348" font-size="12" font-weight="600" text-anchor="start" fill="#132c2b">Error rate</text><circle cx="222" cy="344" r="4" fill="#ffffff" stroke="#526662" stroke-width="1.2"/><text class="t2" x="232" y="348" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Not found</text><circle class="acc" cx="428" cy="344" r="4" fill="#e8a85c"/><text class="ink" x="438" y="348" font-size="11" font-weight="600" text-anchor="start" fill="#0d4f4f">12.7% of calls (4xx/5xx)</text><text class="t2" x="32" y="380" font-size="10" font-weight="400" text-anchor="start" fill="#526662">Sources: Fintech Saudi; BIS (Governor keynote, 15 Sep 2026); SAMA; Ecosystem Watch run 8 Nov 2026.</text></svg>