<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>Saudi open banking vs UAE Open Finance: licences first, hub first</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}.inks{stroke:var(--color-brand-ink,#0d4f4f)}.accs{stroke:var(--color-accent,#e8a85c)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><rect class="soft" x="24" y="24" width="592" height="352" rx="12" fill="#e7efea"/><text class="t2" x="56" y="70" font-size="13" font-weight="600" text-anchor="start" fill="#526662">SAUDI OPEN BANKING VS UAE OPEN FINANCE · 2026</text><text class="ink" x="56" y="112" font-size="30" font-weight="700" text-anchor="start" fill="#0d4f4f">Licences first, hub first</text><rect stroke="#dce5df" class="card bd" x="48" y="136" width="264" height="212" rx="12" fill="#ffffff"/><text class="t2" x="68" y="162" font-size="12" font-weight="600" text-anchor="start" fill="#526662">SAUDI ARABIA</text><text class="ink" x="68" y="190" font-size="20" font-weight="700" text-anchor="start" fill="#0d4f4f">Licences first</text><text class="t" x="68" y="212" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Shared standard, certified in SAMA's Lab</text><text class="t" x="68" y="229" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Licensed provider connects to each bank*</text><text class="t" x="68" y="246" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Account information first, payments next</text><rect stroke="#dce5df" class="card bd" x="328" y="136" width="264" height="212" rx="12" fill="#ffffff"/><text class="t2" x="348" y="162" font-size="12" font-weight="600" text-anchor="start" fill="#526662">UAE</text><text class="ink" x="348" y="190" font-size="20" font-weight="700" text-anchor="start" fill="#0d4f4f">Hub first</text><text class="t" x="348" y="212" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Every call runs through one API Hub</text><text class="t" x="348" y="229" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Consent and tokens held only in the Hub</text><text class="t" x="348" y="246" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Payments and data launched together</text><circle class="acc" cx="80" cy="300" r="9" fill="#e8a85c"/><text class="t2" x="80" y="328" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">provider</text><line class="inks" x1="89" y1="300" x2="214" y2="280" stroke="#0d4f4f" stroke-width="1.4"/><rect class="ink" x="214" y="272" width="40" height="16" rx="4" fill="#0d4f4f"/><line class="inks" x1="89" y1="300" x2="214" y2="300" stroke="#0d4f4f" stroke-width="1.4"/><rect class="ink" x="214" y="292" width="40" height="16" rx="4" fill="#0d4f4f"/><line class="inks" x1="89" y1="300" x2="214" y2="320" stroke="#0d4f4f" stroke-width="1.4"/><rect class="ink" x="214" y="312" width="40" height="16" rx="4" fill="#0d4f4f"/><text class="t2" x="234" y="345" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">banks</text><circle class="acc" cx="360" cy="300" r="9" fill="#e8a85c"/><text class="t2" x="360" y="328" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">TPP</text><line class="inks" x1="369" y1="300" x2="432" y2="300" stroke="#0d4f4f" stroke-width="1.4"/><rect class="acc" x="432" y="288" width="52" height="24" rx="6" fill="#e8a85c"/><text class="t" x="458" y="304" font-size="11" font-weight="700" text-anchor="middle" fill="#132c2b">Hub</text><line class="inks" x1="484" y1="300" x2="526" y2="280" stroke="#0d4f4f" stroke-width="1.4"/><rect class="ink" x="526" y="272" width="40" height="16" rx="4" fill="#0d4f4f"/><line class="inks" x1="484" y1="300" x2="526" y2="300" stroke="#0d4f4f" stroke-width="1.4"/><rect class="ink" x="526" y="292" width="40" height="16" rx="4" fill="#0d4f4f"/><line class="inks" x1="484" y1="300" x2="526" y2="320" stroke="#0d4f4f" stroke-width="1.4"/><rect class="ink" x="526" y="312" width="40" height="16" rx="4" fill="#0d4f4f"/><text class="t2" x="546" y="345" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">LFIs</text><text class="t2" x="56" y="368" font-size="11" font-weight="400" text-anchor="start" fill="#526662">*Our reading of SAMA's framework and payments rules. Sources: SAMA; Open Finance UAE skill.</text></svg>