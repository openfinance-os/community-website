<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>In October 2026, 68.4% of 56,639 consent requests became consents and 10.5% were cancelled</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}.inks{stroke:var(--color-brand-ink,#0d4f4f)}.accs{stroke:var(--color-accent,#e8a85c)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><text class="t" x="32" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#132c2b">October: from consent request to consent</text><text class="t2" x="32" y="66" font-size="12" font-weight="400" text-anchor="start" fill="#526662">Bank consents, October 2026 · Ecosystem Watch run 8 Nov 2026</text><rect class="soft" x="32" y="96" width="576.0" height="56" rx="8" fill="#e7efea"/><text class="t" x="48" y="120" font-size="14" font-weight="600" text-anchor="start" fill="#132c2b">Consent requests</text><text class="t" x="48" y="140" font-size="13" font-weight="400" text-anchor="start" fill="#132c2b">56,639 · 100%</text><rect class="ink" x="32" y="176" width="394.2" height="56" rx="8" fill="#0d4f4f"/><text class="t" x="48" y="200" font-size="14" font-weight="600" text-anchor="start" fill="#ffffff">Became consents</text><text class="t" x="48" y="220" font-size="13" font-weight="400" text-anchor="start" fill="#ffffff">38,766 · 68.4%</text><rect class="acc" x="32" y="256" width="60.3" height="56" rx="8" fill="#e8a85c"/><text class="t" x="136" y="280" font-size="14" font-weight="600" text-anchor="start" fill="#132c2b">Cancelled</text><text class="t" x="136" y="300" font-size="13" font-weight="400" text-anchor="start" fill="#132c2b">5,933 · 10.5% of requests</text>