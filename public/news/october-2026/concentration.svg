<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>Lean Technologies carries 83% of attributed calls; Wio Bank and Mashreq carry about 95% of payment value</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}.inks{stroke:var(--color-brand-ink,#0d4f4f)}.accs{stroke:var(--color-accent,#e8a85c)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><text class="t" x="32" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#132c2b">Who carries the traffic</text><text class="t2" x="32" y="66" font-size="12" font-weight="400" text-anchor="start" fill="#526662">Full months, Nov 2025 to Oct 2026 · Ecosystem Watch run 8 Nov 2026</text><text class="t" x="32" y="112" font-size="14" font-weight="600" text-anchor="start" fill="#132c2b">Share of attributed API calls, by TPP</text><rect class="ink" x="32.0" y="124" width="478.1" height="44" fill="#0d4f4f"/><text class="t" x="42" y="152" font-size="13" font-weight="600" text-anchor="start" fill="#ffffff">Lean Technologies 83.0%</text><rect class="soft" x="510.1" y="124" width="97.9" height="44" fill="#e7efea"/><text class="t" x="520.0799999999999" y="152" font-size="11" font-weight="600" text-anchor="start" fill="#132c2b">Others 17.0%</text><text class="t2" x="32" y="190" font-size="12" font-weight="400" text-anchor="start" fill="#526662">1,760,478 of 2,120,296 attributed calls · concentration index (HHI) 6,965 of 10,000</text><text class="t" x="32" y="236" font-size="14" font-weight="600" text-anchor="start" fill="#132c2b">Share of accepted payment value, by LFI</text><rect class="acc" x="32.0" y="248" width="328.3" height="44" fill="#e8a85c"/><text class="t" x="42" y="276" font-size="13" font-weight="600" text-anchor="start" fill="#132c2b">Wio Bank 57.0%</text><rect class="ink" x="360.3" y="248" width="218.3" height="44" fill="#0d4f4f"/><text class="t" x="370.32" y="276" font-size="13" font-weight="600" text-anchor="start" fill="#ffffff">Mashreq 37.9%</text><rect class="soft" x="578.6" y="248" width="29.4" height="44" fill="#e7efea"/><text class="t2" x="32" y="314" font-size="12" font-weight="400" text-anchor="start" fill="#526662">AED 236.7m and AED 157.1m of AED 414.9m · 9 other LFIs 5.1% · shares are our calculation</text><text class="t2" x="32" y="372" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Source: Ecosystem Watch, run 8 Nov 2026. Unattributed calls (139,560) excluded from TPP shares.</text></svg>