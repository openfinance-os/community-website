<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>Merchant collection fee caps step down from 38 to 25 basis points for the bank fee and from 63 to 50 for the merchant price over five years</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}.inks{stroke:var(--color-brand-ink,#0d4f4f)}.accs{stroke:var(--color-accent,#e8a85c)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><text class="t" x="32" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#132c2b">The caps step down over five years</text><text class="t2" x="32" y="66" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Merchant collections, basis points of payment value · Year 1 = Nebras’s first year of operations</text><rect class="ink" x="88" y="129.0" width="36" height="189.0" rx="4" fill="#0d4f4f"/><text class="ink" x="106" y="121.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0d4f4f">63</text><rect class="acc" x="130" y="204.0" width="36" height="114.0" rx="4" fill="#e8a85c"/><text class="t" x="148" y="196.0" font-size="12" font-weight="700" text-anchor="middle" fill="#132c2b">38</text><text class="t" x="127" y="338" font-size="11" font-weight="600" text-anchor="middle" fill="#132c2b">Year 1</text><rect class="ink" x="198" y="138.0" width="36" height="180.0" rx="4" fill="#0d4f4f"/><text class="ink" x="216" y="130.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0d4f4f">60</text><rect class="acc" x="240" y="213.0" width="36" height="105.0" rx="4" fill="#e8a85c"/><text class="t" x="258" y="205.0" font-size="12" font-weight="700" text-anchor="middle" fill="#132c2b">35</text><text class="t" x="237" y="338" font-size="11" font-weight="600" text-anchor="middle" fill="#132c2b">Year 2</text><rect class="ink" x="308" y="147.0" width="36" height="171.0" rx="4" fill="#0d4f4f"/><text class="ink" x="326" y="139.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0d4f4f">57</text><rect class="acc" x="350" y="222.0" width="36" height="96.0" rx="4" fill="#e8a85c"/><text class="t" x="368" y="214.0" font-size="12" font-weight="700" text-anchor="middle" fill="#132c2b">32</text><text class="t" x="347" y="338" font-size="11" font-weight="600" text-anchor="middle" fill="#132c2b">Year 3</text><rect class="ink" x="418" y="156.0" width="36" height="162.0" rx="4" fill="#0d4f4f"/><text class="ink" x="436" y="148.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0d4f4f">54</text><rect class="acc" x="460" y="231.0" width="36" height="87.0" rx="4" fill="#e8a85c"/><text class="t" x="478" y="223.0" font-size="12" font-weight="700" text-anchor="middle" fill="#132c2b">29</text><text class="t" x="457" y="338" font-size="11" font-weight="600" text-anchor="middle" fill="#132c2b">Year 4</text><rect class="ink" x="528" y="168.0" width="36" height="150.0" rx="4" fill="#0d4f4f"/><text class="ink" x="546" y="160.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0d4f4f">50</text><rect class="acc" x="570" y="243.0" width="36" height="75.0" rx="4" fill="#e8a85c"/><text class="t" x="588" y="235.0" font-size="12" font-weight="700" text-anchor="middle" fill="#132c2b">25</text><text class="t" x="567" y="338" font-size="11" font-weight="600" text-anchor="middle" fill="#132c2b">Year 5</text><line class="bd" x1="64" y1="318" x2="616" y2="318" stroke="#dce5df" stroke-width="1.5"/><rect class="ink" x="64" y="92" width="12" height="12" rx="2" fill="#0d4f4f"/><text class="t" x="82" y="102" font-size="11" font-weight="400" text-anchor="start" fill="#132c2b">TPP to merchant: requested cap</text><rect class="acc" x="300" y="92" width="12" hei