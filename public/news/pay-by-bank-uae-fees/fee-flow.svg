<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>Diagram of fees on a pay-by-bank merchant collection: merchant to TPP, TPP to API Hub, TPP to the payer’s bank, plus caps for other payment types</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}.inks{stroke:var(--color-brand-ink,#0d4f4f)}.accs{stroke:var(--color-accent,#e8a85c)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><text class="t" x="32" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#132c2b">Who pays whom on one pay-by-bank payment</text><text class="t2" x="32" y="66" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Retail and SME merchant collection · caps from the AlTareq Commercial and Pricing Model</text><rect stroke="#dce5df" class="card bd" x="32" y="112" width="108" height="58" rx="10" fill="#ffffff"/><text class="t" x="86.0" y="139.0" font-size="13" font-weight="700" text-anchor="middle" fill="#132c2b">Merchant</text><rect class="soft" x="196" y="112" width="108" height="58" rx="10" fill="#e7efea"/><text class="t" x="250.0" y="139.0" font-size="13" font-weight="700" text-anchor="middle" fill="#132c2b">TPP</text><text class="t2" x="250.0" y="156.0" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">licensed provider</text><rect class="ink" x="360" y="112" width="108" height="58" rx="10" fill="#0d4f4f"/><text class="card" x="414.0" y="139.0" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">API Hub</text><text class="card" x="414.0" y="156.0" font-size="10" font-weight="400" text-anchor="middle" fill="#ffffff">Nebras</text><rect stroke="#dce5df" class="card bd" x="500" y="112" width="108" height="58" rx="10" fill="#ffffff"/><text class="t" x="554.0" y="139.0" font-size="13" font-weight="700" text-anchor="middle" fill="#132c2b">Payer’s bank</text><text class="t2" x="554.0" y="156.0" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">LFI</text><line class="inks" x1="140" y1="141" x2="190" y2="141" stroke="#0d4f4f" stroke-width="1.6"/><polygon class="ink" points="196,141 188,137 188,145" fill="#0d4f4f"/><text class="ink" x="168.0" y="115" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0d4f4f">≤ 63 bps</text><text class="t2" x="168.0" y="128" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">requested</text><line class="inks" x1="304" y1="141" x2="354" y2="141" stroke="#0d4f4f" stroke-width="1.6"/><polygon class="ink" points="360,141 352,137 352,145" fill="#0d4f4f"/><text class="ink" x="332.0" y="115" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0d4f4f">2.5 fils</text><text class="t2" x="332.0" y="128" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">per call</text><line class="accs" x1="250" y1="170" x2="250" y2="204" stroke="#e8a85c" stroke-width="1.6"/><line class="accs" x1="250" y1="204" x2="554" y2="204" stroke="#e8a85c" stroke-width="1.6"/><line class="accs" x1="554" y1="204" x2="554" y2="176" stroke="#e8a85c" stroke-width="1.6"/><polygon class="acc" points="554,170 550,178 558,178" fill="#e8a85c"/><text class="t" x="402" y="198" font-size="10.5" font-weight="700" text-anchor="middle" fill="#132c2b">≤ 38 bps, max AED 50 · collected by Nebras for the LFI</text><text class="t2" x="402" y="220" font-size="10.5" font-weight="400" text-anchor="middle" fill="#526662">The payer’s bank may not charge retail or SME payers anything extra</text><rect class="soft" x="24" y="252" width="592" height="112" rx="12" fill="#e7efea"/><text class="t2" x="44" y="276" font-size="11" font-weight="700" text-anchor="start" fill="#526662">OTHER PAYMENT TYPES · TPP TO BANK CAP</text><text class="t" x="44" y="302" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Person to person, SME to SME</text><text class="ink" x="44" y="317" font-size="11.5" font-weight="700" text-anchor="start" fill="#0d4f4f">25 fils</text><text class="t" x="336" y="302" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Me to me (Year 1)</text><text class="ink" x="336" y="317" font-size="11.5" font-weight="700" text-anchor="start" fill="#0d4f4f">20 fils</text><text class="t" x="44" y="332" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">SME bulk</text><text class="ink" x="44" y="347" font-size="11.5" font-weight="700" text-anchor="start" fill="#0d4f4f">25 fils, max 250 fils per batch</text><text class="t" x="336" y="332" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Large value, rent, invoice link</text><text class="ink" x="336" y="347" font-size="11.5" font-weight="700" text-anchor="start" fill="#0d4f4f">AED 4</text><text class="t2" x="32" y="386" font-size="10" font-weight="400" text-anchor="start" fill="#526662">Fees apply only to technically successful calls. Source: AlTareq Commercial and Pricing Model.</text></svg>