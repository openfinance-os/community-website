<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>Pay by bank in the UAE: 38 bps bank fee cap, capped at AED 50, versus card rates</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}.inks{stroke:var(--color-brand-ink,#0d4f4f)}.accs{stroke:var(--color-accent,#e8a85c)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><rect class="soft" x="24" y="24" width="592" height="352" rx="12" fill="#e7efea"/><text class="t2" x="56" y="70" font-size="13" font-weight="600" text-anchor="start" fill="#526662">PAY BY BANK IN THE UAE · MERCHANT COLLECTIONS</text><text class="ink" x="52" y="170" font-size="96" font-weight="700" text-anchor="start" fill="#0d4f4f">38 bps</text><text class="t" x="56" y="206" font-size="20" font-weight="700" text-anchor="start" fill="#132c2b">cap on the bank fee per payment, Year 1</text><text class="t2" x="56" y="232" font-size="14" font-weight="400" text-anchor="start" fill="#526662">Capped at AED 50 per payment</text><text class="t2" x="56" y="252" font-size="14" font-weight="400" text-anchor="start" fill="#526662">First AED 200 per merchant per day exempt*</text><text class="t" x="56" y="290" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Pay by bank, bank fee cap</text><rect class="acc" x="250" y="278" width="24.896551724137932" height="14" rx="3" fill="#e8a85c"/><text class="ink" x="282.8965517241379" y="290" font-size="11.5" font-weight="700" text-anchor="start" fill="#0d4f4f">0.38%</text><text class="t" x="56" y="314" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Visa debit interchange, online</text><rect class="ink" x="250" y="302" width="65.51724137931035" height="14" rx="3" fill="#0d4f4f"/><text class="ink" x="323.51724137931035" y="314" font-size="11.5" font-weight="700" text-anchor="start" fill="#0d4f4f">1.00%</text><text class="t" x="56" y="338" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Published card gateway rate</text><rect class="ink" x="250" y="326" width="190.0" height="14" rx="3" fill="#0d4f4f"/><text class="ink" x="448.0" y="338" font-size="11.5" font-weight="700" text-anchor="start" fill="#0d4f4f">2.9% + AED 1</text><text class="t2" x="56" y="362" font-size="10.5" font-weight="400" text-anchor="start" fill="#526662">*If the Merchant ID is in the request. Sources: AlTareq Commercial and Pricing Model; Visa UAE; Stripe UAE.</text></svg>