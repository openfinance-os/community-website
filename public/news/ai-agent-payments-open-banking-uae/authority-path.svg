<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>Diagram of an AI agent payment through AlTareq: the customer approves a capped consent once, the API Hub stores it and checks every payment, the agent acts through a licensed TPP, and the bank executes; no field names the agent</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}.inks{stroke:var(--color-brand-ink,#0d4f4f)}.accs{stroke:var(--color-accent,#e8a85c)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><text class="t" x="32" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#132c2b">Where an agent’s authority sits in AlTareq today</text><text class="t2" x="32" y="66" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Variable On Demand payment consent · Standards v2.1</text><rect stroke="#dce5df" class="card bd" x="32" y="96" width="116" height="70" rx="10" fill="#ffffff"/><text class="t" x="90.0" y="125.0" font-size="13" font-weight="700" text-anchor="middle" fill="#132c2b">Customer</text><text class="t2" x="90.0" y="141.0" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">approves once</text><text class="t2" x="90.0" y="154.0" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">at bank or CAAP</text><rect stroke="#dce5df" class="card bd" x="32" y="216" width="116" height="58" rx="10" fill="#ffffff"/><text class="t" x="90.0" y="243.0" font-size="13" font-weight="700" text-anchor="middle" fill="#132c2b">AI agent</text><text class="t2" x="90.0" y="259.0" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">acts for customer</text><rect class="soft" x="196" y="216" width="116" height="58" rx="10" fill="#e7efea"/><text class="t" x="254.0" y="243.0" font-size="13" font-weight="700" text-anchor="middle" fill="#132c2b">TPP</text><text class="t2" x="254.0" y="259.0" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">licensed</text><rect class="ink" x="360" y="136" width="140" height="138" rx="10" fill="#0d4f4f"/><text class="card" x="430.0" y="203.0" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff"></text><text class="card" x="430" y="162" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">API Hub</text><text class="card" x="430" y="182" font-size="10" font-weight="400" text-anchor="middle" fill="#ffffff">single consent store</text><text class="card" x="430" y="204" font-size="9.5" font-weight="700" text-anchor="middle" fill="#ffffff">checks on every payment:</text><text class="card" x="430" y="217" font-size="9.5" font-weight="400" text-anchor="middle" fill="#ffffff">max per payment</text><text class="card" x="430" y="230" font-size="9.5" font-weight="400" text-anchor="middle" fill="#ffffff">max count per period</text><text class="card" x="430" y="243" font-size="9.5" font-weight="400" text-anchor="middle" fill="#ffffff">max value per period</text><text class="card" x="430" y="256" font-size="9.5" font-weight="400" text-anchor="middle" fill="#ffffff">consent not expired</text><text class="card" x="430" y="269" font-size="9.5" font-weight="400" text-anchor="middle" fill="#ffffff">status Authorized</text><rect stroke="#dce5df" class="card bd" x="540" y="216" width="80" height="58" rx="10" fill="#ffffff"/><text class="t" x="580.0" y="243.0" font-size="13" font-weight="700" text-anchor="middle" fill="#132c2b">Bank</text><text class="t2" x="580.0" y="259.0" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">executes</text><line class="accs" x1="148" y1="131" x2="430" y2="131" stroke="#e8a85c" stroke-width="1.6"/><line class="accs" x1="430" y1="131" x2="430" y2="130" stroke="#e8a85c" stroke-width="1.6"/><polygon class="acc" points="430,136 426,128 434,128" fill="#e8a85c"/><text class="t" x="290" y="124" font-size="10.5" font-weight="700" text-anchor="middle" fill="#132c2b">consent approved, stored centrally</text><line class="inks" x1="148" y1="245" x2="189" y2="245" stroke="#0d4f4f" stroke-width="1.6"/><polygon class="ink" points="196,245 188,241 188,249" fill="#0d4f4f"/><line class="inks" x1="312" y1="245" x2="353" y2="245" stroke="#0d4f4f" stroke-width="1.6"/><polygon class="ink" points="360,245 352,241 352,249" fill="#0d4f4f"/><text class="ink" x="336" y="236" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0d4f4f">POST</text><line class="inks" x1="500" y1="245" x2="533" y2="245" stroke="#0d4f4f" stroke-width="1.6"/><polygon class="ink" points="540,245 532,241 532,249" fill="#0d4f4f"/><rect class="soft" x="24" y="288" width="592" height="84" rx="12" fill="#e7efea"/><text class="t2" x="44" y="308" font-size="11" font-weight="700" text-anchor="start" fill="#526662">WHAT THE PAYMENT TELLS THE HUB AND BANK ABOUT WHO IS ACTING</text><text class="ink" x="44" y="328" font-size="11" font-weight="700" text-anchor="start" fill="#0d4f4f">IsCustomerPresent: false</text><text class="t" x="44" y="341" font-size="10.5" font-weight="400" text-anchor="start" fill="#132c2b">“automated/background payments”</text><text class="ink" x="336" y="328" font-size="11" font-weight="700" text-anchor="start" fill="#0d4f4f">ChannelType</text><text class="t" x="336" y="341" font-size="10.5" font-weight="400" text-anchor="start" fill="#132c2b">7 values, none for an agent</text><text class="ink" x="44" y="353" font-size="11" font-weight="700" text-anchor="start" fill="#0d4f4f">EmiratesId (v2.2)</text><text class="t" x="44" y="366" font-size="10.5" font-weight="400" text-anchor="start" fill="#132c2b">the human who approved the consent</text><text class="ink" x="336" y="353" font-size="11" font-weight="700" text-anchor="start" fill="#0d4f4f">OnBehalfOf (v2.2)</text><text class="t" x="336" y="366" font-size="10.5" font-weight="400" text-anchor="start" fill="#132c2b">the business behind the TPP</text><text class="t2" x="32" y="390" font-size="9.5" font-weight="400" text-anchor="start" fill="#526662">Agent context can only go in free-form SupplementaryData. Sources: Nebras TPP Standards v2.1 and v2.2-rc2.</text></svg>
