<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>Horizontal bars of functional areas touched by the 27 changes in the UAE Open Finance v2.2-rc2 changelog, led by Ozone Connect with 20; AI agents get 0</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}.inks{stroke:var(--color-brand-ink,#0d4f4f)}.accs{stroke:var(--color-accent,#e8a85c)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><text class="t" x="32" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#132c2b">What v2.2-rc2 changes, and what it doesn’t</text><text class="t2" x="32" y="66" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Changes touching each functional area, of 27 in the v2.1 → v2.2-rc2 changelog · one change can touch several areas</text><text class="t" x="196" y="99" font-size="11.5" font-weight="400" text-anchor="end" fill="#132c2b">Ozone Connect</text><rect class="ink" x="206" y="88" width="340" height="15" rx="3" fill="#0d4f4f"/><text class="ink" x="554" y="100" font-size="11.5" font-weight="700" text-anchor="start" fill="#0d4f4f">20</text><text class="t" x="196" y="121" font-size="11.5" font-weight="400" text-anchor="end" fill="#132c2b">Data Sharing</text><rect class="ink" x="206" y="110" width="255" height="15" rx="3" fill="#0d4f4f"/><text class="ink" x="469" y="122" font-size="11.5" font-weight="700" text-anchor="start" fill="#0d4f4f">15</text><text class="t" x="196" y="143" font-size="11.5" font-weight="400" text-anchor="end" fill="#132c2b">Service Initiation</text><rect class="ink" x="206" y="132" width="204" height="15" rx="3" fill="#0d4f4f"/><text class="ink" x="418" y