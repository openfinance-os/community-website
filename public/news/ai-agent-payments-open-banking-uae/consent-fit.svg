<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>Matrix comparing Single Instant Payment, Variable On Demand and Delegated SCA for agent use: only Variable On Demand allows many payments with Hub-enforced caps and no human per payment</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}.inks{stroke:var(--color-brand-ink,#0d4f4f)}.accs{stroke:var(--color-accent,#e8a85c)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><text class="t" x="32" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#132c2b">Which consent fits an agent?</text><text class="t2" x="32" y="66" font-size="11" font-weight="400" text-anchor="start" fill="#526662">Three UAE payment consent types · Standards v2.1</text><rect class="soft" x="202.0" y="82" width="120" height="44" rx="8" fill="#e7efea"/><text class="t" x="262" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#132c2b">Single Instant</text><text class="t" x="262" y="115" font-size="12" font-weight="700" text-anchor="middle" fill="#132c2b">Payment</text><rect class="ink" x="332.0" y="82" width="120" height="44" rx="8" fill="#0d4f4f"/><text class="card" x="392" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Variable</text><text class="card" x="392" y="115" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">On Demand</text><rect class="soft" x="462.0" y="82" width="120" height="44" rx="8" fill="#e7efea"/><text class="t" x="522" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#132c2b">Delegated</text><text class="t" x="522" y="115" font-size="12" font-weight="700" text-anchor="middle" fill="#132c2b">SCA</text><rect class="soft" x="24" y="133" width="592" height="32" rx="6" fill="#e7efea"/><text class="t" x="36" y="153" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Payments per consent</text><text class="t" x="262" y="153" font-size="11.5" font-weight="400" text-anchor="middle" fill="#132c2b">One</text><text class="ink" x="392" y="153" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0d4f4f">Many</text><text class="t" x="522" y="153" font-size="11.5" font-weight="400" text-anchor="middle" fill="#132c2b">Many</text><text class="t" x="36" y="189" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Caps the API Hub enforces</text><text class="t" x="262" y="189" font-size="11.5" font-weight="400" text-anchor="middle" fill="#132c2b">Amount fixed</text><text class="ink" x="392" y="189" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0d4f4f">≥1 required</text><text class="t" x="522" y="189" font-size="11.5" font-weight="400" text-anchor="middle" fill="#132c2b">None ({})</text><rect class="soft" x="24" y="205" width="592" height="32" rx="6" fill="#e7efea"/><text class="t" x="36" y="225" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Human needed per payment</text><text class="t" x="262" y="225" font-size="11.5" font-weight="400" text-anchor="middle" fill="#132c2b">Yes, approves it</text><text class="ink" x="392" y="225" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0d4f4f">No</text><text class="t" x="522" y="225" font-size="11.5" font-weight="400" text-anchor="middle" fill="#132c2b">Yes, MFA (≥2 factors)</text><text class="t" x="36" y="261" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Longest life</text><text class="t" x="262" y="261" font-size="11.5" font-weight="400" text-anchor="middle" fill="#132c2b">Single use</text><text class="ink" x="392" y="261" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0d4f4f">Up to 1 year</text><text class="t" x="522" y="261" font-size="11.5" font-weight="400" text-anchor="middle" fill="#132c2b">Up to 1 year</text><rect class="soft" x="24" y="277" width="592" height="32" rx="6" fill="#e7efea"/><text class="t" x="36" y="297" font-size="11.5" font-weight="400" text-anchor="start" fill="#132c2b">Emirates ID per payment (v2.2)*</text><text class="t" x="262" y="297" font-size="11.5" font-weight="400" text-anchor="middle" fill="#132c2b">No</text><text class="ink" x="392" y="297" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0d4f4f">Yes</text><text class="t" x="522" y="297" font-size="11.5" font-weight="400" text-anchor="middle" fill="#132c2b">Yes</text><text class="t" x="36" y="333" font-size="11.5" font-weight="600" text-anchor="start" fill="#132c2b">Fit for an agent</text><text class="t" x="262" y="333" font-size="11.5" font-weight="700" text-anchor="middle" fill="#132c2b">Human in loop</text><text class="ink" x="392" y="333" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0d4f4f">Best fit</text><text class="t" x="522" y="333" font-size="11.5" font-weight="700" text-anchor="middle" fill="#132c2b">Weak</text><text class="t2" x="32" y="368" font-size="9.5" font-weight="400" text-anchor="start" fill="#526662">*Retail customers, from v2.2.</text><text class="t2" x="32" y="384" font-size="9.5" font-weight="400" text-anchor="start" fill="#526662">Sources: Nebras TPP Standards v2.1 (Variable On Demand, Delegated SCA, Consent requirements); v2.2-rc2 changelog §21.</text></svg>
