<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>0 of 27 changes in the UAE Open Finance v2.2-rc2 changelog mention AI agents; an agent works through a TPP, the API Hub holds the consent and caps, the bank executes</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}.inks{stroke:var(--color-brand-ink,#0d4f4f)}.accs{stroke:var(--color-accent,#e8a85c)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><rect class="soft" x="24" y="24" width="592" height="352" rx="12" fill="#e7efea"/><text class="t2" x="56" y="70" font-size="13" font-weight="600" text-anchor="start" fill="#526662">AI AGENT PAYMENTS · UAE OPEN FINANCE</text><text class="ink" x="52" y="166" font-size="92" font-weight="700" text-anchor="start" fill="#0d4f4f">0 of 27</text><text class="t" x="56" y="202" font-size="20" font-weight="700" text-anchor="start" fill="#132c2b">v2.2-rc2 changes that mention AI agents</text><text class="t2" x="56" y="226" font-size="14" font-weight="400" text-anchor="start" fill="#526662">The mandate is central. The agent is invisible.</text><rect stroke="#dce5df" class="card bd" x="56" y="262" width="104" height="48" rx="10" fill="#ffffff"/><text class="t" x="108.0" y="284.0" font-size="13" font-weight="700" text-anchor="middle" fill="#132c2b">AI agent</text><text class="t2" x="108.0" y="300.0" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">not in the standard</text><line class="inks" x1="160" y1="286" x2="179" y2="286" stroke="#0d4f4f" stroke-width="1.6"/><polygon class="ink" points="186,286 178,282 178,290" fill="#0d4f4f"/><rect stroke="#dce5df" class="card bd" x="186" y="262" width="104" height="48" rx="10" fill="#ffffff"/><text class="t" x="238.0" y="284.0" font-size="13" font-weight="700" text-anchor="middle" fill="#132c2b">TPP</text><text class="t2" x="238.0" y="300.0" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">licensed</text><line class="inks" x1="290" y1="286" x2="309" y2="286" stroke="#0d4f4f" stroke-width="1.6"/><polygon class="ink" points="316,286 308,282 308,290" fill="#0d4f4f"/><rect class="ink" x="316" y="262" width="140" height="48" rx="10" fill="#0d4f4f"/><text class="card" x="386.0" y="284.0" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">API Hub</text><text class="card" x="386.0" y="300.0" font-size="10" font-weight="400" text-anchor="middle" fill="#ffffff">consent + caps</text><line class="inks" x1="456" y1="286" x2="469" y2="286" stroke="#0d4f4f" stroke-width="1.6"/><polygon class="ink" points="476,286 468,282 468,290" fill="#0d4f4f"/><rect stroke="#dce5df" class="card bd" x="476" y="262" width="128" height="48" rx="10" fill="#ffffff"/><text class="t" x="540.0" y="284.0" font-size="13" font-weight="700" text-anchor="middle" fill="#132c2b">Customer’s bank</text><text class="t2" x="540.0" y="300.0" font-size="10" font-weight="400" text-anchor="middle" fill="#526662">executes</text><text class="t2" x="56" y="360" font-size="10.5" font-weight="400" text-anchor="start" fill="#526662">Sources: Nebras v2.2-rc2 changelog; Consent Manager guide; Variable On Demand requirements.</text></svg>
