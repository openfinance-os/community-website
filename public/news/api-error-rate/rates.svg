<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>Error and payment success rates</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><text class="t" x="32" y="48" font-size="20" font-weight="700" fill="#132c2b">Calls fail more often than payments do</text><text class="t2" x="32" y="72" font-size="13" fill="#526662">Ecosystem Watch run 26 Oct 2026</text><text class="t" x="32" y="110" font-size="14" fill="#132c2b">API calls with errors (full months)</text><rect class="soft" x="32" y="120" width="500" height="22" rx="6" fill="#e7efea"/><rect class="acc" x="32" y="120" width="92" height="22" rx="6" fill="#e8a85c"/><text class="t" x="544" y="137" font-size="16" font-weight="700" fill="#132c2b">18.4%</text><text class="t" x="32" y="178" font-size="14" fill="#132c2b">API calls with errors (Oct to 21st)</text><rect class="soft" x="32" y="188" width="500" height="22" rx="6" fill="#e7efea"/><rect class="ink" x="32" y="188" width="18" height="22" rx="6" fill="#0d4f4f"/><text class="t" x="544" y="205" font-size="16" font-weight="700" fill="#132c2b">3.7%</text><text class="t" x="32" y="246" font-size="14" fill="#132c2b">Payments accepted (status records)</text><rect class="soft" x="32" y="256" width="500" height="22" rx="6" fill="#e7efea"/><rect class="ink" x="32" y="256" width="476" height="22" rx="6" fill="#0d4f4f"/><text class="t" x="544" y="273" font-size="16" font-weight="700" fill="#132c2b">95.3%</text><text class="t" x="32" y="314" font-size="14" fill="#132c2b">Payments rejected</text><rect class="soft" x="32" y="324" width="500" height="22" rx="6" fill="#e7efea"/><rect class="acc" x="32" y="324" width="10" height="22" rx="6" fill="#e8a85c"/><text class="t" x="544" y="341" font-size="16" font-weight="700" fill="#132c2b">2.1%</text><text class="t2" x="32" y="384" font-size="12" fill="#526662">Rejected share = 1,288 of 61,515 payment-status records (our calculation).</text></svg>