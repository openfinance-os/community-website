<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'DM Sans', sans-serif" role="img"><title>Request flow and SLA targets</title><style>.card{fill:var(--color-card,#ffffff)}.t{fill:var(--color-text,#132c2b)}.t2{fill:var(--color-text-secondary,#526662)}.ink{fill:var(--color-brand-ink,#0d4f4f)}.acc{fill:var(--color-accent,#e8a85c)}.soft{fill:var(--color-soft,#e7efea)}.bd{stroke:var(--color-border,#dce5df)}</style><rect class="card bd" x="0.5" y="0.5" width="639" height="399" rx="16" fill="#ffffff" stroke="#dce5df"/><text class="t" x="32" y="48" font-size="20" font-weight="700" fill="#132c2b">Where the clocks run</text><text class="t2" x="32" y="72" font-size="13" fill="#526662">Every call goes through the API Hub · SLA targets per the Open Finance UAE skill</text><rect class="soft bd" x="40" y="120" width="140" height="70" rx="10" fill="#e7efea" stroke="#dce5df"/><text class="ink" x="110" y="162" font-size="18" font-weight="700" text-anchor="middle" fill="#0d4f4f">TPP</text><rect class="soft bd" x="250" y="120" width="140" height="70" rx="10" fill="#e7efea" stroke="#dce5df"/><text class="ink" x="320" y="162" font-size="18" font-weight="700" text-anchor="middle" fill="#0d4f4f">API Hub</text><rect class="soft bd" x="460" y="120" width="140" height="70" rx="10" fill="#e7efea" stroke="#dce5df"/><text class="ink" x="530" y="162" font-size="18" font-weight="700" text-anchor="middle" fill="#0d4f4f">LFI</text><path d="M180 155 H250 M390 155 H460" stroke="#0d4f4f" stroke-width="2.5" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0d4f4f"/></marker></defs><rect class="acc" x="40" y="224" width="6" height="36" rx="3" fill="#e8a85c"/><text class="t" x="58" y="240" font-size="15" font-weight="600" fill="#132c2b">500 ms p95 per LFI endpoint</text><text class="t2" x="58" y="257" font-size="12" fill="#526662">Hub → LFI → Hub, time to last byte</text><rect class="acc" x="40" y="272" width="6" height="36" rx="3" fill="#e8a85c"/><text class="t" x="58" y="288" font-size="15" font-weight="600" fill="#132c2b">99.5% availability / month</text><text class="t2" x="58" y="305" font-size="12" fill="#526662">≈ 3 h 39 m downtime, maintenance counts</text><rect class="acc" x="40" y="320" width="6" height="36" rx="3" fill="#e8a85c"/><text class="t" x="58" y="336" font-size="15" font-weight="600" fill="#132c2b">3 s end-to-end (Aani)</text><text class="t2" x="58" y="353" font-size="12" fill="#526662">domestic instant payment execution</text></svg>