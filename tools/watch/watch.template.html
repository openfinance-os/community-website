<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAE Open Finance — Ecosystem Watch</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--bd:#30363d;--tx:#e6edf3;--mut:#8b949e;--ac:#58a6ff;
--green:#2ea043;--greenD:#1a7f37;--amber:#d29922;--red:#da3633;--grey:#30363d;--stripe:#21262d;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
section{scroll-margin-top:60px}
h1{font-size:21px;margin:0 0 2px}
.wkly{display:inline-block;vertical-align:middle;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#56d364;background:rgba(46,160,67,.14);border:1px solid rgba(46,160,67,.4);border-radius:20px;padding:2px 10px;margin-left:8px}
.sub{color:var(--mut);font-size:12.5px}
.head{padding:18px 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 0}
.chip{background:var(--panel2);border:1px solid var(--bd);border-radius:20px;padding:3px 11px;font-size:12px;color:var(--mut)}
.chip b{color:var(--tx)}
/* sticky nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);margin:0 -18px 4px;padding:8px 18px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.nav a{font-size:12px;font-weight:600;color:var(--mut);text-decoration:none;padding:5px 12px;border-radius:18px;border:1px solid transparent}
.nav a:hover{color:var(--tx);background:var(--panel2);border-color:var(--bd)}
.nav .brand{font-weight:800;color:var(--tx);font-size:12.5px;margin-right:6px}
.nav .ping{margin-left:auto;font-size:11px;color:var(--amber)}
.seg{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.seg .n{width:28px;height:28px;border-radius:8px;background:var(--ac);color:#04111f;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.seg h2{font-size:17px;margin:0}
.seg .d{color:var(--mut);font-size:12px;margin-left:auto;max-width:50%;text-align:right}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:780px){.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.seg .d{display:none}}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px 15px}
.card h3{margin:0 0 9px;font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.src{font-size:11px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em}
.t-new{background:rgba(46,160,67,.16);color:#56d364;border:1px solid rgba(46,160,67,.4)}
.t-chg{background:rgba(210,153,34,.16);color:#e3b341;border:1px solid rgba(210,153,34,.4)}
.t-no{background:rgba(139,148,158,.12);color:var(--mut);border:1px solid var(--bd)}
.alert{background:rgba(218,54,51,.08);border:1px solid rgba(218,54,51,.35);border-left:3px solid var(--red);border-radius:8px;padding:9px 12px;margin:7px 0;font-size:12.5px}
.alert.std{background:rgba(139,148,158,.07);border-color:var(--bd);border-left-color:var(--mut)}
/* breaking changes */
.bkcard{border-color:rgba(218,54,51,.4);box-shadow:inset 0 0 0 1px rgba(218,54,51,.06)}
.bkcard h3{color:#f0883e}
.bkn{color:#f85149;font-weight:800}
.bkgrouphd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:13px 0 4px;padding-left:8px;border-left:3px solid var(--mut)}
.bkgrouphd.tpp{border-left-color:var(--ac);color:var(--ac)}
.bkgrouphd.lfi{border-left-color:#a371f7;color:#a371f7}
.bkgrouphd.stg{border-left-color:var(--mut);color:var(--mut)}
.bkpill{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.bk-live{background:rgba(218,54,51,.16);color:#ff7b72;border:1px solid rgba(218,54,51,.45)}
.bk-beh{background:rgba(210,153,34,.16);color:#e3b341;border:1px solid rgba(210,153,34,.4)}
.bk-doc{background:rgba(88,166,255,.13);color:#79c0ff;border:1px solid rgba(88,166,255,.35)}
.bk-stg{background:rgba(139,148,158,.12);color:var(--mut);border:1px solid var(--bd)}
/* production sub-grid */
.prodhd{font-size:12.5px;color:var(--mut);margin:2px 0 10px}
.prodbig{font-size:20px;font-weight:800;color:#56d364;font-variant-numeric:tabular-nums}
.pillprod{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em;background:rgba(46,160,67,.16);color:#56d364;border:1px solid rgba(46,160,67,.4)}
.pillsb{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em;background:rgba(139,148,158,.12);color:var(--mut);border:1px solid var(--bd)}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1.35fr;gap:12px}
@media(max-width:780px){.hero{grid-template-columns:1fr}}
.bignum{font-size:42px;font-weight:800;line-height:1;letter-spacing:-.02em}
.bignum span{font-size:15px;color:var(--mut);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}
.tile{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:9px 10px}
.tile .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.tile .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;margin-top:1px}
.delta{font-size:11px;font-weight:700}
.up{color:#56d364}.down{color:#f85149}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px}
.colw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.colw .bv{font-size:9.5px;color:var(--mut);margin-bottom:3px;font-variant-numeric:tabular-nums}
.colw .bar2{width:74%;background:linear-gradient(180deg,#3b82f6,#1f6feb);border-radius:4px 4px 0 0;min-height:2px}
.colw.peak .bar2{background:linear-gradient(180deg,#56d364,#2ea043)}
.colw.part .bar2{background:repeating-linear-gradient(45deg,#1f6feb,#1f6feb 4px,#15448f 4px,#15448f 8px);opacity:.8}
.colw .bl{font-size:10px;color:var(--mut);margin-top:5px}
.movers{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.mv{background:var(--panel2);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;font-size:11.5px}
.mv b{color:var(--tx)}.mv .p{font-weight:700}
/* ribbon */
.ribbon{display:flex;flex-wrap:wrap;gap:8px}
.rb{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:8px 11px}
.rb .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.rb .v{font-size:14px;font-weight:800;margin-top:2px}
.rb.live{border-left:3px solid var(--green)}.rb.moving{border-left:3px solid var(--amber)}.rb.upcoming{border-left:3px solid var(--ac);opacity:.92}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:780px){.board{grid-template-columns:1fr}}
.rel{background:var(--panel);border:1px solid var(--bd);border-radius:11px;padding:11px 12px;position:relative;overflow:hidden}
.rel .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.rel .rn{font-weight:700;font-size:13px}
.rel .ap{font-size:9.5px;color:var(--mut);white-space:nowrap;border:1px solid var(--bd);border-radius:5px;padding:1px 5px}
.rel .sc{color:var(--mut);font-size:11px;margin:4px 0 8px;min-height:26px}
.dd{display:flex;gap:10px;font-size:10.5px;color:var(--mut);margin-bottom:8px}
.dd b{color:var(--tx);font-weight:600}
.meter{height:11px;border-radius:6px;background:var(--stripe);overflow:hidden;position:relative;border:1px solid var(--bd)}
.meter>i{display:block;height:100%;border-radius:5px 0 0 5px}
.mrow{display:flex;align-items:center;gap:8px;margin-top:7px}
.mrow .f{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;min-width:38px}
.mrow .lbl{font-size:10.5px;color:var(--mut)}
.t2e{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.35);color:#79c0ff;margin-left:auto}
.nobs{font-size:11px;color:var(--mut);font-style:italic;padding:8px 0}
.band-past{border-left:3px solid #3b434d}.band-now{border-left:3px solid var(--amber)}.band-soon{border-left:3px solid var(--ac)}
.zero{border-left:3px solid var(--red)!important}
.hm{overflow-x:auto}
.hm table{font-size:11.5px;min-width:700px}
.hm th.col{text-align:center;font-size:10px;white-space:nowrap;padding:5px 4px}
.hm td.c{padding:0}
.cellv{display:block;height:26px;border-radius:4px;margin:2px}
.cv2{background:var(--green)}.cv1{background:var(--amber)}.cv0{background:var(--grey)}.cvb{background:#1f6feb}
.cellv.no{background:repeating-linear-gradient(45deg,#21262d,#21262d 4px,#161b22 4px,#161b22 8px)}
.wvhdr td{background:var(--panel2);font-weight:700;font-size:11px;color:var(--ac);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px}
.lgd{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;font-size:11px;color:var(--mut);align-items:center}
.hmcap{font-size:11px;color:var(--mut);margin:9px 0 2px;font-style:italic}
.lgd span{display:inline-flex;align-items:center;gap:5px}
.sw{width:13px;height:13px;border-radius:3px;display:inline-block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red)}
.relrow{display:grid;grid-template-columns:150px 1fr 64px 120px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12px}
.relrow .nm{display:flex;align-items:center;gap:7px;min-width:0}
.relrow .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--stripe);border:1px solid var(--bd)}
.stack i{display:block;height:100%}
.s2{background:var(--green)}.s4{background:var(--amber)}.s5{background:var(--red)}
.dtag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;padding:1px 6px;border-radius:5px;white-space:nowrap}
.dtag.cons{background:rgba(210,153,34,.16);color:#e3b341;border:1px solid rgba(210,153,34,.4)}
.dtag.back{background:rgba(218,54,51,.14);color:#f85149;border:1px solid rgba(218,54,51,.4)}
.dtag.ok{background:rgba(46,160,67,.16);color:#56d364;border:1px solid rgba(46,160,67,.4)}
.gauge{height:16px;border-radius:8px;background:var(--stripe);overflow:hidden;border:1px solid var(--bd)}
.gauge>i{display:block;height:100%;background:linear-gradient(90deg,#d29922,#56d364)}
.funnel{display:flex;flex-direction:column;gap:7px}
.fstep .fl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px}
.fstep .fb{height:9px;border-radius:5px;background:linear-gradient(90deg,#1f6feb,#56d364);margin-top:3px;min-width:2px}
@media(max-width:780px){.relrow{grid-template-columns:120px 1fr 92px}.relrow>div:nth-child(3){display:none}}
.note{font-size:11px;color:var(--mut);margin-top:8px;line-height:1.45}
.info{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--mut);color:var(--mut);font-size:9px;font-weight:700;font-style:normal;cursor:help;position:relative;margin-left:5px;vertical-align:middle;text-transform:none;letter-spacing:0;flex:none}
.info:hover,.info:focus{color:var(--tx);border-color:var(--ac);outline:none}
.info .tip{display:none;position:absolute;bottom:160%;left:50%;transform:translateX(-50%);width:248px;max-width:70vw;background:#0b0f15;border:1px solid var(--bd);border-radius:9px;padding:9px 11px;font-size:11px;font-weight:400;line-height:1.5;color:var(--tx);text-transform:none;letter-spacing:0;white-space:normal;text-align:left;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.info .tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--bd)}
.info:hover .tip,.info:focus .tip{display:block}
.foot{color:var(--mut);font-size:11px;margin-top:30px;border-top:1px solid var(--bd);padding-top:10px}
</style></head>
