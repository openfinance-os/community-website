    <style>
      @font-face {
        font-family: 'DM Sans';
        src: url('../fonts/dm-sans-regular.ttf');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'DM Sans';
        src: url('../fonts/dm-sans-medium.ttf');
        font-weight: 500;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f6f8f5;
        color: #132c2b;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      main {
        max-width: 1000px;
        margin: auto;
        padding: 48px 24px;
      }
      h1 {
        font-size: 32px;
        font-weight: 500;
        letter-spacing: -0.04em;
      }
      a {
        color: #0d4f4f;
        text-underline-offset: 4px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin: 32px 0;
      }
      .tile {
        padding: 30px;
        background: #fff;
        border: 1px solid #dce5df;
        border-radius: 12px;
      }
      .dark {
        background: #102423;
        color: #f1f7f1;
        border-color: #2f4944;
      }
      .tile img {
        display: block;
        width: 100%;
        margin: 40px auto;
      }
      .tile .icon {
        width: 56px;
      }
      .label {
        font-size: 13px;
      }
      @media (max-width: 650px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Open Finance OS / Clear signal</h1>
      <p>Identity specimen · v2.3 · 10 October 2026</p>
      <div class="grid">
        <div class="tile">
          <span class="label">Light surfaces</span
          ><img src="logo-full.svg" alt="Open Finance OS wordmark" /><img
            class="icon"
            src="logo-icon.svg"
            alt="Teal open-circle mark"
          />
        </div>
        <div class="tile dark">
          <span class="label">Dark surfaces</span
          ><img src="logo-full-dark.svg" alt="Open Finance OS wordmark for dark surfaces" /><img
            class="icon"
            src="logo-icon-dark.svg"
            alt="Mint open-circle mark"
          />
        </div>
      </div>
      <p>
        The open circle and amber signal carry the identity. Use the supplied assets at their
        original proportions; no gradients, glow, or container tile.
      </p>
      <a href="openfinance-os-brand-guidelines.html">Read the complete brand guidelines →</a>
    </main>
  </body>
</html>
