<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <!-- Gradient for depth -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A6B6B"/>
      <stop offset="100%" style="stop-color:#0D4F4F"/>
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C989"/>
      <stop offset="100%" style="stop-color:#E8A85C"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Mark -->
  <g transform="translate(20, 20)">
    <!-- Main rounded square container -->
    <rect x="0" y="0" width="160" height="160" rx="32" ry="32" fill="url(#primaryGradient)"/>
    
    <!-- Globe/network circles -->
    <circle cx="80" cy="80" r="50" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="34" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="18" fill="none" stroke="white" stroke-width="2"/>
    
    <!-- Horizontal ellipse -->
    <ellipse cx="80" cy="80" rx="50" ry="16" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <!-- Vertical ellipse -->
    <ellipse cx="80" cy="80" rx="16" ry="50" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <!-- Connection nodes -->
    <circle cx="80" cy="30" r="7" fill="white" filter="url(#glow)"/>
    <circle cx="130" cy="80" r="7" fill="white" filter="url(#glow)"/>
    <circle cx="80" cy="130" r="7" fill="white" filter="url(#glow)"/>
    <circle cx="30" cy="80" r="7" fill="white" filter="url(#glow)"/>
    
    <!-- Accent dot -->
    <circle cx="118" cy="42" r="11" fill="url(#accentGradient)" filter="url(#glow)"/>
    
    <!-- Center dot -->
    <circle cx="80" cy="80" r="5" fill="white"/>
    
    <!-- Small orbital dots -->
    <circle cx="106" cy="106" r="4" fill="rgba(255,255,255,0.7)"/>
    <circle cx="54" cy="54" r="4" fill="rgba(255,255,255,0.7)"/>
  </g>
  
  <!-- Wordmark -->
  <g transform="translate(205, 100)">
    <!-- OpenFinance -->
    <text x="0" y="12" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" fill="#0D4F4F">
      <tspan>Open</tspan><tspan fill="#1A6B6B">Finance</tspan>
    </text>
    
    <!-- -OS -->
    <text x="398" y="12" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" fill="#E8A85C">-OS</text>
    
    <!-- Tagline -->
    <text x="2" y="50" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#5A6169" letter-spacing="0.1em">THE COMMUNITY HOME FOR UAE OPEN FINANCE</text>
  </g>
</svg>
